<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="古老之圈">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d6c5b">
<title>古老之圈 攻略</title>
<style>
:root{--bg:#e8ece6;--card:#f6f8f4;--ink:#1c2925;--mute:#5d6b65;--line:#c5cec6;--jade:#2d6c5b;--brass:#a9791f;--chip:#d9e0d8;--fs:17px}
@media(prefers-color-scheme:dark){:root{--bg:#121b18;--card:#1a2622;--ink:#e4ebe5;--mute:#93a39b;--line:#2b3b35;--jade:#6fc2a9;--brass:#d9a845;--chip:#243530}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.8 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 50px}
h1{font-size:22px;margin:6px 0 10px;line-height:1.3}
.bar{position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
input[type=search]{width:100%;padding:11px 13px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px}
.chip{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:3px 12px;border-radius:99px}
.chip[aria-pressed=true]{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.meta{color:var(--mute);font-size:13px;margin:10px 0 2px}
ul{list-style:none;margin:0;padding:0}
li a{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
li .t{flex:1;line-height:1.45}
li .dot{width:9px;height:9px;border-radius:50%;background:var(--brass);flex:none}
li.done .dot{background:transparent;border:1px solid var(--line)}
li.done .t{color:var(--mute)}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
#reader{display:none}
.top{position:sticky;top:0;background:var(--bg);display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);z-index:5}
.top button,.nav button{font:inherit;font-size:15px;color:var(--jade);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.top .sp{flex:1}
#art h2.ti{font-size:21px;line-height:1.4;margin:16px 0 4px}
#art .dt{color:var(--mute);font-size:13px;margin-bottom:14px}
#body img{max-width:100%;height:auto;display:block;margin:12px auto;border-radius:6px}
#body table{display:block;overflow-x:auto;max-width:100%}
#body a{color:var(--jade)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.nav button:disabled{opacity:.35}
</style></head><body>
<div class="wrap">
<div id="list">
<h1>印第安納瓊斯：古老之圈 攻略</h1>
<div class="bar"><input type="search" id="q" placeholder="搜尋攻略" aria-label="搜尋"><div class="chips" id="chips"></div></div>
<div class="meta" id="count"></div><ul id="ul"></ul>
</div>
<div id="reader">
<div class="top"><button id="back">‹ 返回</button><span class="sp"></span><button id="fm">A−</button><button id="fp">A＋</button></div>
<div id="art"><h2 class="ti" id="ti"></h2><div class="dt" id="dt"></div><div id="body"></div></div>
<div class="nav"><button id="prev">‹ 上一篇</button><button id="next">下一篇 ›</button></div>
</div></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let P=[],CATS=[],active="全部",done={},fs=17,listY=0;
try{done=JSON.parse(localStorage.getItem("ijd")||"{}");fs=+localStorage.getItem("ijfs")||17}catch(e){}
const st=()=>{try{localStorage.setItem("ijd",JSON.stringify(done));localStorage.setItem("ijfs",fs)}catch(e){}};
const setFs=()=>document.documentElement.style.setProperty("--fs",fs+"px");setFs();
function chips(){$("chips").innerHTML="";["全部",...CATS].forEach(n=>{const b=document.createElement("button");b.className="chip";
b.setAttribute("aria-pressed",n===active);b.textContent=n+" "+(n==="全部"?P.length:P.filter(x=>x.c===n).length);
b.onclick=()=>{active=n;chips();render()};$("chips").appendChild(b)})}
function render(){const q=$("q").value.trim().toLowerCase();
const r=P.filter(x=>(active==="全部"||x.c===active)&&(!q||x.t.toLowerCase().includes(q)));
$("ul").innerHTML=r.map(x=>`<li class="${done[x.id]?"done":""}"><a href="#p${x.id}"><span class="dot"></span><span class="t">${esc(x.t)}</span><span class="tag">${x.c}</span></a></li>`).join("");
$("count").textContent=`共 ${r.length} 篇，已讀 ${r.filter(x=>done[x.id]).length} 篇`}
async function open_(id){const i=P.findIndex(x=>x.id===id);if(i<0)return route();
const p=P[i];$("ti").textContent=p.t;$("dt").textContent=[p.c,p.d].filter(Boolean).join(" ・ ");
$("body").innerHTML="載入中…";
try{$("body").innerHTML=await (await fetch("posts/"+id+".html")).text()}catch(e){$("body").textContent="讀取失敗，請連上網路後再試。"}
done[id]=1;st();
$("prev").disabled=i===0;$("next").disabled=i===P.length-1;
$("prev").onclick=()=>location.hash="p"+P[i-1].id;$("next").onclick=()=>location.hash="p"+P[i+1].id;
window.scrollTo(0,0)}
function route(){const m=location.hash.match(/^#p(\d+)$/);
if(m){listY=listY||scrollY;$("list").style.display="none";$("reader").style.display="block";open_(m[1])}
else{$("reader").style.display="none";$("list").style.display="block";render();scrollTo(0,listY);listY=0}}
$("q").oninput=render;$("back").onclick=()=>history.length>1?history.back():location.hash="";
$("fm").onclick=()=>{fs=Math.max(13,fs-1);setFs();st()};$("fp").onclick=()=>{fs=Math.min(26,fs+1);setFs();st()};
window.onhashchange=route;
fetch("data.json").then(r=>r.json()).then(d=>{P=d.posts;CATS=d.cats;chips();route()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
