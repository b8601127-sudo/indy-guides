<h3>鬧鬼</h3>
<p>在工人區的藍色帳篷處出門往右走到頭，左拐經過一個帳篷可以看到狗洞，直接鑽過去。</p>
<p align="center"><img alt="" loading="lazy" src="img/362556209ada.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/6688a8e7b043.webp"/></p>
<p>先進入右邊箭頭所示的帳篷裡。</p>
<p align="center"><img alt="" loading="lazy" src="img/492156e45d8a.webp"/></p>
<p>桌子上可以拿到筆記【鬧鬼事件報告】、【墳墓照片】，在筆記下方蓋著一個鑰匙，拾取獲得鬧鬼墓穴鑰匙並開啟謎團【鬧鬼】。</p>
<p align="center"><img alt="" loading="lazy" src="img/b30d41c0e93d.webp"/></p>
<p>然後進入左邊黑影下的帳篷。</p>
<p align="center"><img alt="" loading="lazy" src="img/2e436814a60d.webp"/></p>
<p>右側箱子上可以拿一個藥瓶。</p>
<p align="center"><img alt="" loading="lazy" src="img/5e22c1fe5e77.webp"/></p>
<p>左側桌子上可以拿到筆記【邁爾的信】。</p>
<p align="center"><img alt="" loading="lazy" src="img/2aaa19f193fc.webp"/></p>
<p>隨後來到下圖所示位置。</p>
<p align="center"><img alt="" loading="lazy" src="img/3286369d6f51.webp"/></p>
<p>前方有一個柵欄門，拿出剛才的鑰匙打開門進入深處的洞穴。</p>
<p align="center"><img alt="" loading="lazy" src="img/d5b31b797d53.webp"/></p>
<p>裡面可以拿到筆記【間諜筆記】和一個古老文物。</p>
<p align="center"><img alt="" loading="lazy" src="img/af7ce42dc98d.webp"/></p>
