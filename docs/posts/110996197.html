<h3>街頭鬥士I</h3>
<p>這個任務需要做支線任務【驚人發現】，在地窖箱子裡面獲得。</p>
<p>在做驚人發現的支線時，地窖裡的一個箱子需要密碼，我們可以看這個提示。</p>
<p align="center"><img alt="" loading="lazy" src="img/d990cd7ec485.webp"/></p>
<p>我們現在的遊戲劇情時間背景是在1937年，遊戲開頭都有過提示，而這個密碼的提示是去年，也就是36年的11月，得到密碼3611，不過由於這個密碼是根據國外的日期格式來的，所以我們要先輸入11再輸入36（坑死了），所以最後是1136。</p>
<p align="center"><img alt="" loading="lazy" src="img/a96b78b373aa.webp"/></p>
<p>箱子裡面獲得街頭鬥士I。</p>
<p align="center"><img alt="" loading="lazy" src="img/f1199f92cca5.webp"/></p>
