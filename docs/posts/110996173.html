<h3>自由的靈魂</h3>
<p align="center"><img alt="" loading="lazy" src="img/108bf2497c83.webp"/></p>
<p>大路右側照片牆可以拾取【尋貓啟示】並接取謎團【自由的靈魂】。</p>
<p align="center"><img alt="" loading="lazy" src="img/454acc336447.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/9a435073218d.webp"/></p>
<p>回到地圖中間，按照下圖所示路線往地圖右上的位置走。</p>
<p align="center"><img alt="" loading="lazy" src="img/b4f4b680fb7c.webp"/></p>
<p>沿著右牆的架子爬到樓頂。</p>
<p align="center"><img alt="" loading="lazy" src="img/5357919ed6e0.webp"/></p>
<p>樓頂下圖紅框處有一隻貓，拍攝這隻貓，然後回到剛才接取謎團的位置，將貓的照片貼上去即可。</p>
<p align="center"><img alt="" loading="lazy" src="img/8052eea0a298.webp"/></p>
