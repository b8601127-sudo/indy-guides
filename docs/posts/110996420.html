<h3>孩童遊戲</h3>
<p>這個謎題在村子裡，來到村子的下圖所示位置。</p>
<p align="center"><img alt="" loading="lazy" src="img/82d7d9850380.webp"/></p>
<p>此處最下方樓梯口的位置，可以拿到一個瓶子，將瓶子扔到地面打碎可以撿到筆記【第一個瓶子的資訊】。</p>
<p align="center"><img alt="" loading="lazy" src="img/7a7a75f8377b.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/09b34829c3df.webp"/></p>
<p>然後來到村子右側紅框所示位置。</p>
<p align="center"><img alt="" loading="lazy" src="img/63524cae6397.webp"/></p>
<p>這裡有一個NPC釣魚，他旁邊的石頭上有一個瓶子，拿起來砸碎可以獲得筆記【第三個瓶子的資訊】。</p>
<p align="center"><img alt="" loading="lazy" src="img/044ac1ec2666.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/6c8e4b343bf4.webp"/></p>
<p>隨後往村子上面走。</p>
<p align="center"><img alt="" loading="lazy" src="img/d9bbad3ce78d.webp"/></p>
<p>第三個瓶子夾在樹上，直接靠近用長鞭拽下來即可。</p>
<p align="center"><img alt="" loading="lazy" src="img/f6b51d99642a.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/02d872d44e79.webp"/></p>
<p>最後來到村子下方，具體位置看下圖。</p>
<p align="center"><img alt="" loading="lazy" src="img/bb7769def89d.webp"/></p>
<p>目的地有一個箱子，裡面可以拿到冒險書籍【移山之力】。</p>
<p align="center"><img alt="" loading="lazy" src="img/a7bf1b772efd.webp"/></p>
