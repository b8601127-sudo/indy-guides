<h3>探索小技巧</h3>
<p>主功能表打開選項詳情頁，找到協助工具，往下滑動找到【高對比模式】，選擇【輪廓】並將效果強度按照自己喜好調整到50%、80%、100%不等。</p>
<p>下方的對比度顏色建議將物品與武器分別調整成紅色有綠色較為明顯的顏色，這樣玩家可以在場景中一目了然的看到分佈有哪些武器，有哪些物品可以拿。</p>
<p align="center"><img alt="" loading="lazy" src="img/2c54de78b996.webp"/></p>
<p>梵蒂岡郵局除了可以獲得相機外，還有很多書籍可以買，使用這些資料可以得知許多重要收集品的位置。</p>
