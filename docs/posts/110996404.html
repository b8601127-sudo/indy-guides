<h3>麻煩的跡象</h3>
<p>完成陷入困境的修女支線後，前往西斯廷禮拜堂，在中間的大十字架處的桌子上可以拿到筆記【吉娜的要求】並接取謎團【麻煩的跡象】。</p>
<p align="center"><img alt="" loading="lazy" src="img/9190e9048c21.webp"/></p>
<p>西斯廷禮拜堂做陷入困境的修女任務時被一個士兵強行拉入了懺悔室，完成修女任務後再次來到懺悔室的入口，這裡可以撿到筆記【岳母的來信】。</p>
<p align="center"><img alt="" loading="lazy" src="img/7665054c29cf.webp"/></p>
<p>來到使徒宮裡面的挖掘現場，進入右前方的房屋裡。</p>
<p align="center"><img alt="" loading="lazy" src="img/9e5687df1c2c.webp"/></p>
<p>房屋右側桌子上新刷出來一個保險箱，通過密碼【1891】打開右側的保險箱，裡面可以獲得筆記【聯絡人的資訊】。</p>
<p align="center"><img alt="" loading="lazy" src="img/d3e940d0cd88.webp"/></p>
<p>回到西斯廷禮拜堂，將資訊放回我們拿到第一個謎題筆記的位置即可完成謎團【麻煩的跡象】。</p>
<p align="center"><img alt="" loading="lazy" src="img/6c094000c645.webp"/></p>
