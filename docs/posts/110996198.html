<h3>終極粉碎</h3>
<p>這個技能在地圖上這個位置前面的帳篷裡的箱子裡，箱子裡需要密碼打開。</p>
<p align="center"><img alt="" loading="lazy" src="img/205cab23b18d.webp"/></p>
<p>先找到抽屜裡的票根，可以看出來密碼，正面是38，然後用鍵盤翻頁就能看到背後的數字了，是52。</p>
<p align="center"><img alt="" loading="lazy" src="img/59005de5119c.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/94d78203a179.webp"/></p>
<p>箱子密碼就是5238，打開後裡面有技能書終極粉碎。</p>
<p align="center"><img alt="" loading="lazy" src="img/c502bfe1adfd.webp"/></p>
<p>前面還有一個帳篷，獲得熱血I。</p>
<p align="center"><img alt="" loading="lazy" src="img/8bcba0e6d9f4.webp"/></p>
