<h3>光明的未來</h3>
<p>來到下圖所示位置。</p>
<p align="center"><img alt="" loading="lazy" src="img/9bbb79e72b28.webp"/></p>
<p>從此處的狗洞鑽進去，往右邊的房子走。</p>
<p align="center"><img alt="" loading="lazy" src="img/cfb2d4aa5750.webp"/></p>
<p>寶箱裡拿冒險書籍【格擋臂膀】，床邊可以拿到筆記【納粹筆記】。</p>
<p align="center"><img alt="" loading="lazy" src="img/ad7a16862992.webp"/></p>
<p>走到對面出口可以拿一個藥瓶。</p>
<p align="center"><img alt="" loading="lazy" src="img/aaba05993d70.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/5d03a1ee412a.webp"/></p>
<p>出去直接往右前方盡頭所示的房子走。</p>
<p align="center"><img alt="" loading="lazy" src="img/340c873f4b66.webp"/></p>
<p>連桌子上可以拿到一個無線頻率與筆記【波爾的來信】。</p>
<p align="center"><img alt="" loading="lazy" src="img/5214df1ff7b3.webp"/></p>
<p>在左側房間的桌子上可以拿到筆記【秘魯明信片】。</p>
<p align="center"><img alt="" loading="lazy" src="img/b4e62720bfeb.webp"/></p>
<p>外部中間的桌子上可以拿到漫畫書【驚悚故事1】。</p>
<p align="center"><img alt="" loading="lazy" src="img/b4ef1a57e6a4.webp"/></p>
<p>最後來到下圖所示位置。</p>
<p align="center"><img alt="" loading="lazy" src="img/6d8829c1fa53.webp"/></p>
<p>這裡有一個寶箱，通過密碼【0926】打開，裡面放的是即將引爆的炸彈，開啟寶箱後立刻遠離此位置。</p>
<p align="center"><img alt="" loading="lazy" src="img/ade0f986e1cd.webp"/></p>
