<p><span></span></p>
<p>先來到這個鐵門面前，往左邊走。</p>
<p align="center"><img alt="" loading="lazy" src="img/1a607ef99b46.webp"/></p>
<p>這裡有個骷髏，骷髏邊上有一個石板，拿上它。</p>
<p align="center"><img alt="" loading="lazy" src="img/a11231806269.webp"/></p>
<p>將石板插入中間的機關，兩邊的火勢突然變大。</p>
<p align="center"><img alt="" loading="lazy" src="img/3d67d19f8c90.webp"/></p>
<p>抬頭看左邊頭上，我們需要過去拿別的石板。</p>
<p align="center"><img alt="" loading="lazy" src="img/0759123b741c.webp"/></p>
<p>過來之後拿取石板。</p>
<p align="center"><img alt="" loading="lazy" src="img/aec77d04a9f7.webp"/></p>
<p>我們將這個石板給左邊的吉娜。</p>
<p align="center"><img alt="" loading="lazy" src="img/094c4d698ddd.webp"/></p>
<p>我們想用繩子回去發現木頭被火燒斷了。</p>
<p align="center"><img alt="" loading="lazy" src="img/11a5665f34b1.webp"/></p>
<p>我們可以往左邊的石柱子爬上邊緣。</p>
<p align="center"><img alt="" loading="lazy" src="img/b46a1c0a8a08.webp"/></p>
<p>爬到這個位置以後，上去，或者來到中間直接按CTRL下來。</p>
<p align="center"><img alt="" loading="lazy" src="img/7ce0e0a98564.webp"/></p>
<p>另一側的橫杆還是沒斷的，我們可以過去。</p>
<p align="center"><img alt="" loading="lazy" src="img/1b66948c03c4.webp"/></p>
<p>然後找右邊的吉娜拿回石板，插入面前的這個機關。</p>
<p align="center"><img alt="" loading="lazy" src="img/d27184d85930.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/a6f8fe2b5459.webp"/></p>
<p>然後再用長鞭回到中間就可以出去了。</p>
<p align="center"><img alt="" loading="lazy" src="img/afea86c78d14.webp"/></p>
