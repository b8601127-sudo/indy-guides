<p>【支線：守護者聖殿-解開鏡子謎題】（光之雕像謎題）</p>
<p>這個任務後面還有一個謎題【光之雕像】。</p>
<p align="center"><img alt="" loading="lazy" src="img/2f8660e6b8d3.webp"/></p>
<p>此次解密先將圓盤的光線對準右邊，左邊裡面暫時還沒東西。</p>
<p align="center"><img alt="" loading="lazy" src="img/9ff3448abc4e.webp"/></p>
<p>我們準備鑽進右邊門的時候，門直接壞掉了，只會有一條縫，我們現在需要和吉娜互動，將她送到上面的洞口。</p>
<p align="center"><img alt="" loading="lazy" src="img/7fbda8b4d6f9.webp"/></p>
<p>等一會之後，她會將圓盤從門底下遞過來，我們去拿起來。</p>
<p align="center"><img alt="" loading="lazy" src="img/df51ed618830.webp"/></p>
<p>趁她現在還在回來的路上，我們可以先將光線對準左邊的門。</p>
<p align="center"><img alt="" loading="lazy" src="img/051aed5b1ffd.webp"/></p>
<p>將剛才拿到的圓盤放到左邊門的託盤裡面。</p>
<p align="center"><img alt="" loading="lazy" src="img/84f5a366afb5.webp"/></p>
<p>放完後，吉娜已經拿著另外一塊圓盤出來了，不過我們現在沒有地方放圓盤的位置了。</p>
<p align="center"><img alt="" loading="lazy" src="img/a8008af5b0c6.webp"/></p>
<p>聰明的吉娜表示她來當人形圓盤，我們將光線對著她照就可以完成解密了。</p>
