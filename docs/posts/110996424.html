<h3>準時到達</h3>
<p>從下方進入紅框內的島嶼。</p>
<p align="center"><img alt="" loading="lazy" src="img/39c6c5ca8b2b.webp"/></p>
<p>來到這個營地首先進入大鐘旁邊的帳篷。</p>
<p align="center"><img alt="" loading="lazy" src="img/fc507ec0c44b.webp"/></p>
<p>裡面的桌子上可以拿到筆記【密碼對照表】、【貨運檔】，通過密碼【59404】打開寶箱獲得素可泰藥物。</p>
<p align="center"><img alt="" loading="lazy" src="img/febe9583ff8b.webp"/></p>
<p>然後從帳篷出來，往左邊紅框內的小建築走，此處可以拿到漫畫書【駭人傳說6】。</p>
<p align="center"><img alt="" loading="lazy" src="img/fda2b5e8a404.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/1ec403a222eb.webp"/></p>
<p>接著往右側的另一個出口走，出口處的保安室裡可以拿到一個無線頻率。</p>
<p align="center"><img alt="" loading="lazy" src="img/74ddc99cd6a4.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/7fd9479d9c6e.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/36039d6b9a18.webp"/></p>
<p>保安室不遠處的貨箱堆裡面還藏著一個寶箱。</p>
<p align="center"><img alt="" loading="lazy" src="img/774fe3ee56b1.webp"/></p>
<p>完事來到另一個出口，這裡是一個木制保安室，往出口右側的石頭建築裡走，裡面可以拿到冒險書籍【抓力驚人2】。</p>
<p align="center"><img alt="" loading="lazy" src="img/0ddd6d9edee9.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/e6f35eda3773.webp"/></p>
