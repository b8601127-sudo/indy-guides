<h3>秘密中的秘密</h3>
<p>沿著下圖路線，從地圖左側進入建築【西斯廷禮拜堂】。</p>
<p align="center"><img alt="" loading="lazy" src="img/def5a9ac76fe.webp"/></p>
<p>使用【牧師鑰匙】打開印有十字架的門上二樓。</p>
<p align="center"><img alt="" loading="lazy" src="img/9b0166fcb80e.webp"/></p>
<p>二樓房間右側桌子上可以拾取【尼科萊蒂的信】接取新謎團【秘密中的秘密】。</p>
<p align="center"><img alt="" loading="lazy" src="img/ac92c9084772.webp"/></p>
<p>房間深處保險櫃旁邊與右上角落各有一個雕像，雕像下方有保險箱密碼的提示。</p>
<p align="center"><img alt="" loading="lazy" src="img/06cab652ed52.webp"/></p>
<p>倆雕像中間桌子有一個比較隱蔽的抽屜，打開可以獲得謎題筆記【行星圖】。</p>
<p align="center"><img alt="" loading="lazy" src="img/456a57ea45e7.webp"/></p>
<p align="center"><img alt="" loading="lazy" src="img/18d4f3b92cba.webp"/></p>
<p>通過這張筆記與雕像下面的符號可以獲得密碼【4471】，在保險箱上輸入密碼可獲得筆記【隱藏的筆記】、冒險書籍【傷口處理員1】。</p>
<p align="center"><img alt="" loading="lazy" src="img/211474ce4d9d.webp"/></p>
